name: Build Android AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm uninstall @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob --legacy-peer-deps
          npm install @capacitor/core@7.0.1 @capacitor/cli@7.0.1 @capacitor/android@7.0.1 @capacitor-community/admob@7.0.0 --legacy-peer-deps
          npm run build

      - name: Setup Capacitor & AdMob
        run: |
          echo '{"appId": "com.tharindu.smartkids", "appName": "Smart Kids", "webDir": "dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Add AdMob App ID to AndroidManifest
        run: |
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7219225410567354~9748668868"\/><\/application>/' android/app/src/main/AndroidManifest.xml

      - name: Generate Upload Keystore
        run: |
          keytool -genkey -v -keystore android/app/smartkids-upload.jks -keyalg RSA -keysize 2048 -validity 10000 -alias smartkids -storepass SmartKids2026 -keypass SmartKids2026 -dname "CN=Tharindu, OU=Dev, O=SmartKids, L=Ingiriya, S=Western, C=LK"

      - name: Build Signed Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Pandroid.injected.signing.store.file="$(pwd)/app/smartkids-upload.jks" -Pandroid.injected.signing.store.password=SmartKids2026 -Pandroid.injected.signing.key.alias=smartkids -Pandroid.injected.signing.key.password=SmartKids2026

      - name: Upload Play Store AAB & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: SmartKids-PlayStore-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/smartkids-upload.jks
