name: Build Android AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm uninstall @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob --legacy-peer-deps
          npm install @capacitor/core@7.0.1 @capacitor/cli@7.0.1 @capacitor/android@7.0.1 @capacitor-community/admob@7.0.0 --legacy-peer-deps
          npm run build

      - name: Setup Capacitor & AdMob
        run: |
          echo '{"appId": "com.tharindu.smartkids", "appName": "Smart Kids", "webDir": "dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Update SDK versions to 36 and Version Code to 2
        run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.1"/g' android/app/build.gradle

      - name: Add AdMob App ID to AndroidManifest
        run: |
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7219225410567354~9748668868"\/><\/application>/' android/app/src/main/AndroidManifest.xml

      - name: Decode Existing Upload Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/smartkids-upload.jks

      - name: Build Signed Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Pandroid.injected.signing.store.file="$(pwd)/app/smartkids-upload.jks" -Pandroid.injected.signing.store.password=SmartKids2026 -Pandroid.injected.signing.key.alias=smartkids -Pandroid.injected.signing.key.password=SmartKids2026

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: SmartKids-PlayStore-AAB-Fixed
          path: android/app/build/outputs/bundle/release/app-release.aab
