name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob --legacy-peer-deps
          npm run build

      - name: Setup Capacitor & AdMob
        run: |
          echo '{"appId": "com.tharindu.smartkids", "appName": "Smart Kids", "webDir": "dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Add AdMob App ID to AndroidManifest
        run: |
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7219225410567354~9748668868"\/><\/application>/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKids-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
