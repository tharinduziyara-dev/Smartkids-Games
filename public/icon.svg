<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <radialGradient id="belly" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
    <linearGradient id="owlBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="110" cy="112" r="20" fill="#FDE68A" opacity="0.7" />
  <circle cx="408" cy="128" r="14" fill="#FFFFFF" opacity="0.6" />
  <!-- Ear tufts -->
  <path d="M138 158 C122 108, 174 102, 198 142 Z" fill="#4F46E5" />
  <path d="M374 158 C390 108, 338 102, 314 142 Z" fill="#4F46E5" />
  <!-- Owl body -->
  <ellipse cx="256" cy="284" rx="146" ry="152" fill="url(#owlBody)" />
  <!-- Wings -->
  <ellipse cx="118" cy="304" rx="34" ry="74" transform="rotate(-14 118 304)" fill="#4338CA" />
  <ellipse cx="394" cy="304" rx="34" ry="74" transform="rotate(14 394 304)" fill="#4338CA" />
  <!-- Belly -->
  <ellipse cx="256" cy="326" rx="92" ry="88" fill="url(#belly)" />
  <!-- Eye circles -->
  <circle cx="204" cy="218" r="52" fill="#FFFFFF" />
  <circle cx="308" cy="218" r="52" fill="#FFFFFF" />
  <!-- Pupils -->
  <circle cx="212" cy="220" r="26" fill="#0F172A" />
  <circle cx="300" cy="220" r="26" fill="#0F172A" />
  <!-- Eye sparkles -->
  <circle cx="203" cy="209" r="9" fill="#FFFFFF" />
  <circle cx="291" cy="209" r="9" fill="#FFFFFF" />
  <!-- Cheeks -->
  <ellipse cx="152" cy="256" rx="18" ry="11" fill="#FB7185" opacity="0.65" />
  <ellipse cx="360" cy="256" rx="18" ry="11" fill="#FB7185" opacity="0.65" />
  <!-- Beak -->
  <path d="M234 242 L278 242 L256 280 Z" fill="url(#beak)" />
  <!-- Feet -->
  <ellipse cx="210" cy="434" rx="28" ry="14" fill="#F59E0B" />
  <ellipse cx="302" cy="434" rx="28" ry="14" fill="#F59E0B" />
  <!-- Musical note badge -->
  <circle cx="404" cy="108" r="46" fill="#FBBF24" />
  <path d="M396 124 V88 L422 82 V116" stroke="#78350F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="388" cy="126" r="10" fill="#78350F" />
  <circle cx="414" cy="118" r="10" fill="#78350F" />
</svg>
